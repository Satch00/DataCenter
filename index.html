<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apostila de História – 3ª Série</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Merriweather:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6fb;--card:#fff;--wine:#800020;--violet:#7b2cbf;--soft:#f1e6f8;--txt:#2a1830;--mut:#6b5878;--line:#e3d3ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140d1b;--card:#1e1229;--soft:#2a1838;--txt:#f3e8f7;--mut:#bfa8d0;--line:#3c2350;--wine:#c4375a;--violet:#b57bec}}
:root[data-theme="dark"]{--bg:#140d1b;--card:#1e1229;--soft:#2a1838;--txt:#f3e8f7;--mut:#bfa8d0;--line:#3c2350;--wine:#c4375a;--violet:#b57bec}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--txt);font:16px/1.6 Inter,system-ui,sans-serif;padding:20px 16px 48px}
.w{max-width:860px;margin:0 auto}
header{background:linear-gradient(135deg,#800020,#7b2cbf);color:#fff;border-radius:18px;padding:32px 24px;text-align:center;margin-bottom:24px}
header h1{font:700 2rem Merriweather,serif;line-height:1.2}
header p{margin-top:8px;color:#ead6f7;font-size:.95rem}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:28px}
nav a{background:var(--soft);color:var(--violet);text-decoration:none;font-weight:600;font-size:.82rem;padding:5px 11px;border-radius:99px;border:1px solid var(--line)}
h2{display:flex;gap:12px;align-items:center;font:700 1.15rem/1.3 Merriweather,serif;color:var(--wine);margin:34px 0 14px;padding-bottom:10px;border-bottom:3px solid var(--violet)}
h2 b{flex:none;background:var(--wine);color:#fff;font:800 .9rem Inter,sans-serif;border-radius:10px;padding:6px 11px}
.q{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--violet);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.tag{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--wine)}
.p{font-weight:600;margin:4px 0 8px}
.r{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:.95rem}
.r::before{content:"Resposta  ";font-weight:800;color:var(--violet);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem;background:var(--card)}
th{background:linear-gradient(90deg,#800020,#7b2cbf);color:#fff;text-align:left;padding:9px 10px}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.g{font:800 1.1rem Inter;color:var(--wine);text-align:center}
footer{text-align:center;color:var(--mut);font-size:.8rem;margin-top:36px}
@media print{body{background:#fff;color:#000}.q,table{break-inside:avoid}nav{display:none}}
</style>
</head>
<body>
<div class="w">
<header><h1>Apostila de História</h1><p>Currículo em Ação · Volume 4 · 3ª Série do Ensino Médio<br>Respostas resumidas e objetivas</p></header>
<nav id="nav"></nav>
<main id="m"></main>
<footer>Apostila de revisão · Vermelho vinho &amp; roxo violeta</footer>
</div>
<script>
const A=[
["“Integrar para não entregar”: violência aos povos indígenas na ditadura",[
["Atividade 1","O jornal foi favorável ou contrário ao SPI? Por que o governo extinguiu o órgão?","Contrário: o tom é de denúncia e condena a violência, como o extermínio de tribos inteiras. A repercussão nacional e internacional levou o governo a extinguir o SPI e criar um novo órgão (Funai) para renovar a política indigenista e acalmar as críticas. Para parte da historiografia, a medida também serviu para silenciar as investigações e evitar punições."],
["Atividade 2","Compare os argumentos das duas autoridades.","O capitão Pinheiro (GRIN) via os indígenas como uma “guarda” de policiamento interno. O general Bandeira Mello propunha integrá-los pelo trabalho “útil”, que gerasse lucro. <b>Semelhança:</b> ambos queriam forçar a integração à nação, com abandono da cultura e adoção dos padrões do Estado. <b>Diferença:</b> a função atribuída (policiamento × mão de obra)."]]],
["Movimento Negro Unificado: luta contra o racismo e a repressão",[
["Atividade 1","Como a LSN de 1967 e a política externa reprimiram os movimentos negros? E a democracia racial?","A LSN (art. 14) enquadrou as denúncias de racismo como “propaganda adversa” que ameaçava o prestígio do Brasil, transformando a denúncia em crime. A política externa, voltada à África, exaltava a “democracia racial”, o que escondia o racismo interno e tratava os movimentos negros como ameaça à “harmonia racial”."],
["Atividade 2","Por que o Sinba foi fundamental para a crítica à democracia racial?","Porque contrapôs a narrativa oficial: expôs a desqualificação de manifestações como o Black Rio (acusadas de alienação ou racismo às avessas) e mostrou que essas acusações revelavam o próprio racismo da sociedade, desmontando o discurso da democracia racial."]]],
["Brasil amazônico e Chico Mendes",[
["Atividade 1","Por que a borracha “adiou” a devastação? O que mudou na década de 1970?","O valor estava no látex, então a seringueira precisava ficar viva e a floresta ficou em pé. Nos anos 1970, os governos militares ocuparam a Amazônia por razões geopolíticas (domínio nacional) e, com tecnologia disponível e sem limite biológico, houve destruição massiva."],
["Atividade 2","Qual foi a proposta inovadora dos seringueiros?","As <b>Reservas Extrativistas (Resex)</b>: terras da União, de uso coletivo por comunidades tradicionais, com planos de manejo. Unem proteção da floresta e direitos territoriais, diferente da reforma agrária convencional."]]],
["Greves do ABC paulista",[
["Atividade 1 · Q1","Dois instrumentos de controle sindical e a continuidade com o Estado Novo.","(1) Intervenção, com interventores nomeados nos sindicatos; (2) proibição de candidatura de pessoas investigadas pela repressão. A continuidade está no controle do sindicalismo pela estrutura oficial subordinada ao Ministério do Trabalho, como no Estado Novo."],
["Atividade 1 · Q2","Dois conflitos entre o novo sindicalismo e a estrutura oficial.","(1) <b>Autonomia:</b> o novo sindicalismo exigia independência do Ministério do Trabalho. (2) <b>Base:</b> defendia comissões de fábrica nos locais de trabalho, contra a representação concentrada na cúpula burocrática."],
["Atividade 1 · Q3","Efeitos das greves (1978–1980) e reação do regime.","Mostraram a força e a organização operária e impulsionaram a unificação nacional do movimento. O regime reagiu com intervenções, prisões de líderes e processos pela LSN."]]],
["“Tortura Nunca Mais!”: a ditadura civil-militar",[
["Estação 1 · Q1","Como leis e órgãos repressivos institucionalizaram a violência?","A Doutrina de Segurança Nacional virou estrutura jurídica, ampliando o conceito de crime político. DOI-Codi, Dops e SNI tornaram vigilância, tortura e eliminação métodos de Estado."],
["Estação 1 · Q2","O que as práticas do Texto II mostram sobre o Estado?","Que o Estado foi autor, executor e encobridor dos crimes: 310 métodos de tortura catalogados, mortes forjadas (suicídio, atropelamento) e desaparecimentos com valas comuns."],
["Estação 2 · Q3","Importância do “Brasil: Nunca Mais”.","Reuniu, nos arquivos da própria Justiça Militar, provas de que a tortura era sistemática. A Fonte I cita Dulce Pandolfi, usada como “cobaia” em demonstração de tortura a mais de 20 oficiais."]]],
["Comissão Nacional da Verdade",[
["Relatório","Conclusão sobre a morte de Rubens Paiva (1971).","Rubens Paiva sofreu prisão arbitrária, tortura e morte sob custódia do Estado, com ocultação do corpo. A versão oficial (resgate por terroristas) foi desmentida pelo médico Amilcar Lobo e pelo coronel Ronaldo Campos, que admitiu ter simulado a fuga queimando o veículo."]]],
["Diretas Já: mobilização popular por democracia",[
["Atividade 1","O que se infere da Lei da Anistia (1979)?","Foi uma “anistia recíproca” que garantiu impunidade a agentes torturadores. Apresentada como “reconciliação”, foi imposta sob coerção militar, e por isso não é legítima como parece: impediu a punição de crimes contra a humanidade."],
["Atividade 2","Conteúdo da Emenda Dante de Oliveira.","Propunha eleições diretas para presidente em 1984. Simbolizou a contestação ao regime e impulsionou a maior mobilização popular do período."]]],
["Direitos e cidadania: um projeto em construção",[
["Atividade 2 · Q1","Por que a Constituição de 1988 foi um avanço para os quilombolas?","Pela primeira vez reconheceu legalmente seus territórios e protegeu seu patrimônio cultural (art. 216), com dever do Estado de promover reparação histórica."],
["Atividade 2 · Q2","Por que ainda há desafios na prática?","Porque a lei não garantiu políticas públicas imediatas nem titulação rápida das terras, devido a interesses fundiários, burocracia e preconceito estrutural."]]],
["“A Bancada do Batom”: mulheres na política",[
["Atividade 1 · Q1","Posição de Zé Povo contra o voto feminino.","Teme a “inversão” da ordem, com mulheres “dominando tudo”. Reflete a sociedade patriarcal, que via a política como espaço masculino e a cidadania feminina como ameaça à família."],
["Atividade 1 · Q2","Argumentos de Maurício Lacerda.","Na charge: “a Constituição é clara”, ou seja, mulheres podem votar. Nos Anais: cita o caso de D. Izabel Dillon e o art. 4º da Lei Saraiva (voto a diplomados por faculdades)."],
["Atividade 1 · Q3","Por que o caso Izabel Dillon não bastou?","Foi decisão judicial isolada e exigia diploma superior, algo restrito a uma elite minúscula. Não mudou a lei eleitoral para todas as mulheres."]]],
["Nova República: de Tancredo Neves a Sarney",[
["Atividade 1 · Q1","Medidas do Plano Cruzado contra a inflação.","Congelamento de preços, tarifas e serviços; nova moeda (Cruzado); gatilho salarial (reajuste automático ao atingir 20% de inflação)."],
["Atividade 1 · Q2","Por que “estelionato eleitoral”?","Porque o congelamento foi mantido artificialmente até vencer as eleições de 1986. Logo depois veio o Cruzado II, com alta de tarifas e liberação de preços, revelando a manobra eleitoral."],
["Atividade 1 · Q3","Por que o Cruzado falhou a longo prazo?","Não corrigiu o déficit público nem a demanda excessiva. O congelamento gerou desabastecimento, ágio e desorganização da produção, e a inflação disparou no descongelamento."]]],
["Governo Collor: do confisco da poupança ao impeachment",[
["Atividade 1 · Q1","Por que Collor cresceu rápido nas pesquisas?","Pelo discurso populista anticorrupção (“caçador de marajás”), domínio da TV, boa imagem e origem em Alagoas, estado pouco conhecido, o que dificultava checar seu histórico."],
["Atividade 1 · Q2","Papel da imprensa.","Primeiro ajudou a construir a imagem de “caçador de marajás”. Depois, reportagens investigativas expuseram recursos públicos na campanha e o esquema PC Farias, decisivas para o impeachment."],
["Atividade 2","A charge do salto com vara.","Corrida (1989): ascensão eleitoral. Salto (1990–91): auge, com o Plano Collor. Queda (1992): colapso por recessão, confisco, corrupção e protestos dos Caras-Pintadas, levando ao impeachment."]]],
["O Plano Real",[
["Estação 1 · Q1","Situação do país com Itamar e efeito perverso da inflação.","Hiperinflação, queda do PIB e desemprego de 15% na Grande SP. A inflação corroía o poder de compra dos pobres, sem acesso a contas com correção diária."],
["Estação 1 · Q2","Como funcionou a URV?","Como indexador temporário que corrigia preços diariamente, sem congelamento, para a população entender o valor real antes da troca pelo Real."],
["Estação 2 · Q4","Duas medidas neoliberais de FHC.","Privatização de estatais e abertura econômica (desregulamentação e incentivo ao capital estrangeiro)."],
["Estação 2 · Q5","Como contribuíram para dívida externa e desemprego?","A moeda sobrevalorizada prejudicou a balança comercial e exigiu empréstimos do FMI. A abertura expôs a indústria à concorrência, com fechamento de empresas e desemprego."],
["Estação 3 · Q6","Impactos do neoliberalismo nos anos 1990.","Flexibilização trabalhista e trabalho precário, em conflito com os direitos de 1988. O desemprego médio subiu de 13,16% (1995) para mais de 18% (1998/99), com crescimento instável."]]]
];
const E=[
["UFPR 2017","Indígenas na ditadura","e","Indígenas foram tratados como obstáculos às grandes obras desenvolvimentistas."],
["ENEM 2017","Lei 10.639/2003","b","Resultado da mobilização do movimento negro."],
["UNESP 2022","Modelo de Chico Mendes","a","Reserva extrativista: proteção da floresta e das populações tradicionais."],
["ENEM 2020","Seringueiros","c","Ligaram a luta pela terra à preservação da mata nativa."],
["UERJ 2021","Greve do ABC (1979)","b","Parou setor estratégico e teve apoio da sociedade civil."],
["UNICAMP 2024","Herzog e repressão","d","Perseguição, tortura e execução em nome da segurança nacional."],
["ENEM 2014","Objetivo da CNV","e","Esclarecer as circunstâncias das violações de direitos humanos."],
["ENEM 2016","Charge das Diretas Já","a","Campanha contra a legitimidade das eleições indiretas."],
["ENEM 2015","Novos movimentos sociais","b","Ampliaram a democracia para além do voto periódico."],
["ENEM 2013","Charge dos anos 1930","e","Crítica ao voto feminino, conquistado em 1932."],
["ENEM 2016","Nova República","c","Continuidade: políticos vindos do regime autoritário (ex.: Sarney)."],
["ENEM 2011","Caras-Pintadas","e","Porta-voz da sociedade, influenciou o impeachment de Collor."],
["ESAMC 2015","Charge sobre FHC","d","Ironiza o processo de privatização."],
["UFPR 2010","Modelo econômico pós-1990","b","Internacionalização da economia, capital estrangeiro e privatizações."]
];
const m=document.getElementById("m"),nav=document.getElementById("nav");let h="";
A.forEach((a,i)=>{const n=i+1;
nav.innerHTML+=`<a href="#a${n}">Aula ${n}</a>`;
h+=`<section id="a${n}"><h2><b>AULA ${n}</b>${a[0]}</h2>`;
a[1].forEach(q=>{h+=`<div class="q"><div class="tag">${q[0]}</div><div class="p">${q[1]}</div><div class="r">${q[2]}</div></div>`});
h+="</section>"});
nav.innerHTML+=`<a href="#ex">Exercícios</a>`;
h+=`<section id="ex"><h2><b>GABARITO</b>Caderno de exercícios</h2><div class="tw"><table><tr><th>Banca</th><th>Tema</th><th>Gab.</th><th>Por quê</th></tr>`;
E.forEach(e=>{h+=`<tr><td>${e[0]}</td><td>${e[1]}</td><td class="g">${e[2].toUpperCase()}</td><td>${e[3]}</td></tr>`});
h+="</table></div></section>";
m.innerHTML=h;
</script>
</body>
</html>
